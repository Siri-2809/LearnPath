<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta Configuration -->
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description"
    content="LearnPath - Personalized Placement Preparation System powered by AI and Machine Learning." />
  <meta name="keywords"
    content="LearnPath, Placement Preparation, AI Learning, Mock Tests, Study Plans, Skill Gap Analysis, MERN Stack, FastAPI" />
  <meta name="author" content="LearnPath Team" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="LearnPath" />
  <meta property="og:description" content="An AI-powered platform for personalized placement preparation." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="%PUBLIC_URL%/favicon.ico" />
  <meta property="og:url" content="http://localhost:3000" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />

  <!-- Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Title -->
  <title>LearnPath | Personalized Placement Preparation</title>

  <!-- Inline Styling -->
  <style>
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
        sans-serif;
      background-color: #f8fafc;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loader Styles */
    .loader-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #ffffff;
      flex-direction: column;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid #ffffff;
      border-top: 5px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <noscript>
    You need to enable JavaScript to run this application.
  </noscript>

  <!-- React Root -->
  <div id="root">
    <!-- Initial Loader -->
    <div class="loader-container">
      <div class="loader"></div>
      <div class="loader-text">Loading LearnPath...</div>
    </div>
  </div>
</body>

</html>
